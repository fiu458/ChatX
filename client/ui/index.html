<!doctype html>
<html lang="lt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatX</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-background"></div>
    <div id="statusToast" class="status-toast hidden"></div>

    <section id="authView" class="auth-view">
      <div class="auth-card">
        <div class="brand-row">
          <div class="brand-logo">CX</div>
          <div>
            <h1>ChatX</h1>
            <p>Discord style desktop chat</p>
          </div>
        </div>

        <div class="auth-tabs">
          <button id="showLoginBtn" class="active" type="button">Prisijungimas</button>
          <button id="showRegisterBtn" type="button">Registracija</button>
        </div>

        <form id="loginForm" class="auth-form">
          <label for="loginEmail">El. paštas</label>
          <input id="loginEmail" type="email" autocomplete="email" required />

          <label for="loginPassword">Slaptažodis</label>
          <input id="loginPassword" type="password" autocomplete="current-password" required />

          <button type="submit">Prisijungti</button>
          <button id="resendVerificationBtn" class="secondary-btn" type="button">
            Siųsti patvirtinimą dar kartą
          </button>
        </form>

        <form id="registerForm" class="auth-form hidden">
          <label for="registerName">Vardas</label>
          <input id="registerName" type="text" maxlength="32" required />

          <label for="registerEmail">El. paštas</label>
          <input id="registerEmail" type="email" autocomplete="email" required />

          <label for="registerPassword">Slaptažodis</label>
          <input id="registerPassword" type="password" minlength="6" autocomplete="new-password" required />

          <button type="submit">Sukurti paskyrą</button>
        </form>

        <small id="serverBadge"></small>
      </div>
    </section>

    <main id="appView" class="app-view hidden">
      <aside class="server-rail">
        <button id="homeButton" class="server-pill home-pill" type="button" title="ChatX">CX</button>
        <div id="serverList" class="server-list"></div>
        <button id="createGroupBtn" class="server-pill add-pill" type="button" title="Sukurti grupę">+</button>
      </aside>

      <aside class="channel-rail">
        <header class="rail-header">
          <div>
            <h2 id="railTitle">Kanalai</h2>
            <p id="railSubtitle">Pasirink serverį</p>
          </div>
          <div class="rail-actions">
            <button id="toggleFriendsBtn" class="ghost-btn" type="button">Draugai</button>
            <button id="addChannelBtn" class="ghost-btn" type="button">+ Kanalas</button>
          </div>
        </header>

        <section class="rail-section">
          <div class="rail-section-head">
            <h3 id="leftSectionTitle">Kanalų sąrašas</h3>
            <button id="addFriendBtn" class="tiny-btn" type="button">+ Friend</button>
          </div>
          <ul id="leftList" class="entity-list"></ul>
        </section>

        <section class="rail-section requests">
          <div class="rail-section-head">
            <h3>Friend Requests</h3>
          </div>
          <ul id="requestList" class="entity-list compact"></ul>
        </section>

        <div id="profileCard" class="profile-card"></div>
        <button id="logoutBtn" class="logout-btn" type="button">Atsijungti</button>
      </aside>

      <section class="chat-panel">
        <header class="chat-header">
          <div>
            <h1 id="chatTitle">ChatX</h1>
            <p id="chatSubtitle">Prisijunk ir pradėk chatinti</p>
          </div>
          <span id="connectionBadge" class="connection-badge offline">Atsijungta</span>
        </header>

        <div id="messageList" class="message-list"></div>

        <form id="composerForm" class="composer">
          <input
            id="messageInput"
            type="text"
            maxlength="2000"
            placeholder="Rašyk žinutę..."
            disabled
          />
          <button id="sendBtn" type="submit" disabled>Siųsti</button>
        </form>
      </section>

      <aside class="member-rail">
        <header class="member-header">
          <h3>Nariai</h3>
          <p id="memberCount">0 online</p>
        </header>
        <ul id="memberList" class="member-list"></ul>

        <div class="member-footer">
          <p>ChatX <span id="appVersion"></span></p>
          <a href="https://chatx-production-cc2e.up.railway.app" target="_blank" rel="noreferrer">Server status</a>
        </div>
      </aside>
    </main>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
